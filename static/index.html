<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Go WS Chat</title>
    <style>
        body {
            font: 14px/1.4 system-ui, sans-serif;
            max-width: 640px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        #log {
            border: 1px solid #ddd;
            border-radius: 6px;
            height: 400px;
            overflow-y: auto;
            padding: .75rem;
            background: #fafafa;
        }

        #log div {
            padding: 2px 0;
        }

        #log .system {
            color: #888;
            font-style: italic;
            font-size: 13px;
        }

        #log .me {
            color: #0066cc;
        }

        form {
            display: flex;
            gap: .5rem;
            margin-top: .75rem;
        }

        input {
            flex: 1;
            padding: .5rem;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            padding: .5rem 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
        }

        .status {
            color: #888;
            font-size: 12px;
            margin-bottom: .5rem;
        }
    </style>
</head>

<body>
    <h1>Go WebSocket Chat</h1>
    <div class="status" id="status">connecting…</div>
    <div id="log"></div>
    <form id="form">
        <input id="input" autocomplete="off" placeholder="Сообщение…" autofocus>
        <button>Send</button>
    </form>

    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        const form = document.getElementById('form');
        const input = document.getElementById('input');

        // Спрашиваем имя ДО подключения.
        let name = prompt('Как тебя зовут?', '');
        name = (name || '').trim().slice(0, 32) || 'anon';

        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${proto}//${location.host}/ws`);

        function append(text, cls) {
            const div = document.createElement('div');
            div.textContent = text;
            if (cls) div.className = cls;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        ws.onopen = () => {
            status.textContent = `connected as ${name}`;
            ws.send(name); // первое сообщение — ник
        };

        ws.onclose = () => { status.textContent = 'disconnected'; };

        ws.onmessage = (e) => {
            const text = e.data;
            if (text.startsWith('***')) {
                append(text, 'system');
            } else if (text.startsWith(name + ':')) {
                append(text, 'me');
            } else {
                append(text);
            }
        };

        form.onsubmit = (e) => {
            e.preventDefault();
            if (input.value.trim()) {
                ws.send(input.value);
                input.value = '';
            }
        };
    </script>
</body>

</html>
